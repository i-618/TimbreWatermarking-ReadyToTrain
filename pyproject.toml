[project]
name = "timbre"
version = "v1.0"
description = "Timbre watermarking: embed and decode robust audio watermarks."
requires-python = ">=3.8"

# Core dependencies needed to import `timbre` and run the watermark API
# (add_watermark / decode_watermark). Training, dataset loading, and the
# fidelity metrics (PESQ / speaker similarity) need the extras below.
#
# NOTE: torch / torchaudio are intentionally left unpinned so you can install
# the build that matches your CUDA / CPU setup (see https://pytorch.org). numpy
# is pinned < 2 because the compiled deps in this project are built against
# numpy 1.x and crash under numpy 2.x.
dependencies = [
    "numpy<2",
    "torch",
    "torchaudio",
    "librosa==0.9.2",
    "scipy==1.10.1",
    "SoundFile>=0.10.3",
    "PyYAML>=6.0",
    "audiomentations==0.28.0",
    "kornia==0.6.9",
    "rich>=13.0",
]

[project.optional-dependencies]
# Everything required to train the model, load datasets, and compute the
# speech-quality / similarity metrics used by extract.py and common_test.py.
full = [
    "fire==0.5.0",
    "julius==0.2.7",
    "pydub==0.25.1",
    "pypesq==1.2.4",
    "Resemblyzer==0.1.1.dev0",
    "scikit_learn==1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["timbre"]

# Ship the non-Python assets the package needs at runtime: the YAML configs, the
# bundled HiFi-GAN vocoder + config, and the model checkpoints.
artifacts = [
    "timbre/config/*.yaml",
    "timbre/hifigan/config.json",
    "timbre/hifigan/model/**/*",
    "timbre/results/ckpt/pth/*.pth.tar",
]
